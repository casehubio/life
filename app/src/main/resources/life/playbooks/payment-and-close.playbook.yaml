playbook: "1.0"
schema: client
---
meta:
  title: Payment and Close
  description: Initiate payment, upload invoice, notify via chat
  tags: [contractor-coordination, post-processing]
  domain: contractor-coordination
---
steps:
  - rest-request:
      method: POST
      url: /api/connectors/bank/initiatePayment
      body:
        reference: payment-ref
    timeout: 15s
    retry: 2
  - rest-request:
      method: POST
      url: /api/connectors/documents/uploadFile
      body:
        fileName: invoice
    timeout: 10s
    retry: 2
  - rest-request:
      method: POST
      url: /api/connectors/chat/sendChat
      body:
        message: job-completed
    timeout: 10s
