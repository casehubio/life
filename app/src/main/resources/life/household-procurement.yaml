dsl: "0.1"
version: "1.0.0"
name: household-procurement
namespace: casehub-life
title: Household procurement — analyse need, search products, approve, order, track delivery

spec:

  ## --- CBR -----------------------------------------------------------------
  cbr:
    features:
      category: ".procurementRequest.category"
      itemType: ".procurementRequest.itemType"
      budget: ".procurementRequest.budget"
      quantity: ".procurementRequest.quantity"
      season: ".procurementRequest.season"
    weights:
      category: 3.0
      itemType: 2.0
      budget: 2.0
      quantity: 1.0
      season: 0.5
    topK: 5
    minSimilarity: 0.3
    domain: casehubio/life/household
    caseType: household-procurement
    timing: case-lifetime

  ## --- Capabilities --------------------------------------------------------
  capabilities:
    - name: analyse-need
      description: "Analyse procurement request — determine items, budget, urgency, and whether gifting or supply reorder"
      inputSchema: "{ procurementRequest: .procurementRequest, cbrCalibration: .cbrCalibration }"
      outputSchema: "{ needsAnalysis: . }"

    - name: search-products
      description: "Search product catalogue for matching items via CommercePlatform"
      inputSchema: "{ needsAnalysis: .needsAnalysis }"
      outputSchema: "{ productResults: . }"

    - name: fulfil-order
      description: "Add selected items to cart, checkout, and confirm order via CommercePlatform"
      inputSchema: "{ purchaseApproval: .purchaseApproval, productResults: .productResults }"
      outputSchema: "{ orderResult: . }"

    - name: track-delivery
      description: "Check order delivery status via CommercePlatform and notify household"
      inputSchema: "{ orderResult: .orderResult }"
      outputSchema: "{ deliveryStatus: . }"

    - name: procurement-sentinel
      description: "Persistent heartbeat monitor for delivery tracking and reorder alerts"
      inputSchema: "."
      outputSchema: "."

  ## --- Goals ---------------------------------------------------------------
  goals:
    - name: order-fulfilled
      kind: success
      condition: ".deliveryStatus != null and .deliveryStatus.delivered == true"

  ## --- Completion ----------------------------------------------------------
  completion:
    success:
      allOf:
        - order-fulfilled

  ## --- Bindings ------------------------------------------------------------
  bindings:

    ## 1. Analyse need — fires when procurement request arrives
    - name: analyse-need
      on: { contextChange: {} }
      when: ".procurementRequest != null and .needsAnalysis == null"
      capability: analyse-need

    ## 2. Search products — fires after need analysed
    - name: search-products
      on: { contextChange: {} }
      when: ".needsAnalysis != null and .productResults == null"
      capability: search-products

    ## 3. Human task: household-admin approves purchase
    - name: approve-purchase
      on: { contextChange: {} }
      when: ".productResults != null and .purchaseApproval == null"
      humanTask:
        title: "Approve household purchase"
        expiresIn: PT72H
        candidateGroups: [household-admin]
        scope: "casehubio/life/household"
        inputMapping: "{ productResults: .productResults, needsAnalysis: .needsAnalysis, procurementRequest: .procurementRequest }"
        outputMapping: "{ purchaseApproval: . }"

    ## 4. Fulfil order — fires after purchase approved
    - name: fulfil-order
      on: { contextChange: {} }
      when: ".purchaseApproval != null and .orderResult == null"
      capability: fulfil-order

    ## 5. Track delivery — fires after order placed
    - name: track-delivery
      on: { contextChange: {} }
      when: ".orderResult != null and .deliveryStatus == null"
      capability: track-delivery

    - name: procurement-sentinel
      on: { contextChange: {} }
      when: ".procurementRequest != null"
      capability: procurement-sentinel

    - name: sentinel-escalation
      on: { contextChange: {} }
      when: ".sentinelReport != null and .sentinelReport.escalationRequired == true and (.sentinelEscalation == null or .sentinelEscalation.resolved == true)"
      humanTask:
        title: "Sentinel detected procurement issue"
        expiresIn: PT24H
        candidateGroups: [household-admin]
        scope: "casehubio/life/household"
        inputMapping: "{ sentinelReport: .sentinelReport }"
        outputMapping: "{ sentinelEscalation: . }"
